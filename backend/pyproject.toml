# Backend tooling config. Runtime deps: requirements.in -> requirements.lock (hashed);
# test/lint tools: requirements-dev.in -> requirements-dev.lock. Ruff lives in ../ruff.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "error",
    # Upstream, not our code: Starlette 1.3.1's TestClient still names the anyio.abc alias
    # that anyio 4.15 deprecated. Drop this line when the Starlette pin moves past it.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
