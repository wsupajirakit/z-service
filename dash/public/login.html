<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>z-service — Sign in</title>
<script src="/theme-init.js"></script>
<style>
  /* Same palette as the app (HeroUI default theme): light by default, html.dark for dark. */
  :root {
    color-scheme: light;
    --background: oklch(0.9702 0 0);
    --foreground: oklch(0.2103 0.0059 285.89);
    --surface: oklch(100% 0 0);
    --surface-secondary: oklch(0.9524 0.0013 286.37);
    --muted: oklch(0.5517 0.0138 285.94);
    --border: oklch(90% 0.004 286.32);
    --field: oklch(100% 0 0);
    --accent: oklch(0.6204 0.195 253.83);
    --accent-hover: color-mix(in oklab, var(--accent) 90%, black 10%);
    --accent-foreground: oklch(0.9911 0 0);
    --accent-soft: color-mix(in oklab, var(--accent) 15%, transparent);
    --danger: oklch(0.6532 0.2328 25.74);
    --success: oklch(0.6 0.17 150.81);
    --shadow: 0 2px 4px 0 rgba(0, 0, 0, .04), 0 1px 2px 0 rgba(0, 0, 0, .06), 0 0 1px 0 rgba(0, 0, 0, .06);
  }
  html.dark {
    color-scheme: dark;
    --background: oklch(12% 0.005 285.823);
    --foreground: oklch(0.9911 0 0);
    --surface: oklch(0.2103 0.0059 285.89);
    --surface-secondary: oklch(0.257 0.0037 286.14);
    --muted: oklch(70.5% 0.015 286.067);
    --border: oklch(28% 0.006 286.033);
    --field: oklch(0.257 0.0037 286.14);
    --accent-soft: color-mix(in oklab, var(--accent) 12%, transparent);
    --danger: oklch(0.7 0.18 24.63);
    --success: oklch(0.7329 0.1935 150.81);
    --shadow: none;
  }
  /* Without scripts, follow the system setting. */
  @media (prefers-color-scheme: dark) {
    html:not(.light):not(.dark) {
      color-scheme: dark;
      --background: oklch(12% 0.005 285.823);
      --foreground: oklch(0.9911 0 0);
      --surface: oklch(0.2103 0.0059 285.89);
      --surface-secondary: oklch(0.257 0.0037 286.14);
      --muted: oklch(70.5% 0.015 286.067);
      --border: oklch(28% 0.006 286.033);
      --field: oklch(0.257 0.0037 286.14);
      --danger: oklch(0.7 0.18 24.63);
      --success: oklch(0.7329 0.1935 150.81);
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--background); color: var(--foreground);
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: min(100%, 380px); }
  .toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
  .seg {
    display: inline-flex; padding: 2px; border-radius: 10px;
    background: var(--surface-secondary); border: 1px solid var(--border);
  }
  .seg button, .icon-btn {
    font: inherit; font-size: 12px; font-weight: 600; color: var(--muted);
    background: transparent; border: 0; border-radius: 8px; cursor: pointer;
    padding: 6px 10px; line-height: 1;
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--foreground); box-shadow: var(--shadow); }
  .icon-btn {
    display: inline-grid; place-items: center; width: 32px; height: 30px; padding: 0;
    background: var(--surface-secondary); border: 1px solid var(--border); border-radius: 10px;
  }
  .seg button:hover, .icon-btn:hover { color: var(--foreground); }
  .seg button:focus-visible, .icon-btn:focus-visible, input:focus-visible, .submit:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .icon-btn svg { width: 16px; height: 16px; }
  .card {
    padding: 28px 26px 24px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .tile {
    display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 12px; background: var(--accent); color: var(--accent-foreground);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
  }
  .tile svg { width: 22px; height: 22px; }
  .brand-name { font-weight: 600; line-height: 1.2; }
  .brand-tag { font-size: 12px; color: var(--muted); }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
  .sub { margin: 0 0 18px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 15px;
    background: var(--field); color: var(--foreground);
    border: 1px solid var(--border); border-radius: 12px; outline: none;
    box-shadow: var(--shadow); transition: border-color .15s;
  }
  input:hover { border-color: color-mix(in oklab, var(--border) 70%, var(--foreground) 30%); }
  input:focus { border-color: var(--accent); }
  .submit {
    width: 100%; margin-top: 22px; padding: 11px 12px; font: inherit; font-size: 15px; font-weight: 600;
    background: var(--accent); color: var(--accent-foreground); border: 0; border-radius: 12px; cursor: pointer;
    transition: background .15s;
  }
  .submit:hover { background: var(--accent-hover); }
  .submit:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
  .err { color: var(--danger); }
  .ok { color: var(--success); }
  .hint { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .hint:empty { display: none; }
</style>
<script>
(function () {
  // Theme ('zs.theme': 'light' / 'dark', absent = follow the system) and language
  // ('zs.lang'), the same keys the app uses.
  var root = document.documentElement;
  var media = window.matchMedia('(prefers-color-scheme: dark)');
  var savedTheme = function () {
    var s = localStorage.getItem('zs.theme');
    return s === 'light' || s === 'dark' ? s : null;
  };
  var isDark = function () { return (savedTheme() || (media.matches ? 'dark' : 'light')) === 'dark'; };
  var applyTheme = function () {
    var dark = isDark();
    root.classList.toggle('dark', dark);
    root.classList.toggle('light', !dark);
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.style.colorScheme = dark ? 'dark' : 'light';
  };
  applyTheme();

  var M = {
    en: {
      page: 'z-service — Sign in',
      tagline: 'Market data service',
      title: 'Sign in',
      subtitle: 'Enter your username and password',
      registerTitle: 'Set up the first account',
      registerSubtitle: 'Choose a username and password (this can be done only once)',
      username: 'Username',
      password: 'Password',
      btn: 'Sign in',
      registerBtn: 'Create account and sign in',
      registerHint: 'This system has a single user: once registered, it cannot be registered again.',
      noServer: 'Cannot reach the server',
      checking: 'Checking…',
      failed: 'Sign-in failed',
      success: 'Success: signing you in',
      language: 'Language',
      toDark: 'Switch to the dark theme',
      toLight: 'Switch to the light theme',
    },
    th: {
      page: 'z-service — เข้าสู่ระบบ',
      tagline: 'บริการข้อมูลตลาด',
      title: 'เข้าสู่ระบบ',
      subtitle: 'กรอก username และ password',
      registerTitle: 'ตั้งบัญชีครั้งแรก',
      registerSubtitle: 'ตั้ง username และ password (ตั้งได้ครั้งเดียว)',
      username: 'Username',
      password: 'Password',
      btn: 'เข้าสู่ระบบ',
      registerBtn: 'สมัครและเข้าใช้งาน',
      registerHint: 'ระบบนี้มีผู้ใช้ได้คนเดียว — เมื่อสมัครแล้วจะสมัครซ้ำไม่ได้อีก',
      noServer: 'ต่อ server ไม่ได้',
      checking: 'กำลังตรวจสอบ…',
      failed: 'เข้าสู่ระบบไม่สำเร็จ',
      success: 'สำเร็จ — กำลังเข้าสู่ระบบ',
      language: 'ภาษา',
      toDark: 'เปลี่ยนเป็นธีมมืด',
      toLight: 'เปลี่ยนเป็นธีมสว่าง',
    },
  };
  var lang = (function () {
    var s = localStorage.getItem('zs.lang');
    if (s === 'en' || s === 'th') return s;
    return navigator.language.toLowerCase().indexOf('th') === 0 ? 'th' : 'en';
  })();
  root.lang = lang;
  var T = function (key) { return M[lang][key]; };

  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>';

  document.addEventListener('DOMContentLoaded', function () {
    const $ = (id) => document.getElementById(id);
    let mode = 'login';
    // The status line: one of our messages (re-translated on a language switch) or the server's text.
    let msg = { cls: 'msg', key: '', text: '' };
    const setMsg = (cls, key, text) => { msg = { cls: cls, key: key || '', text: text || '' }; renderMsg(); };
    const renderMsg = () => {
      $('msg').className = msg.cls;
      $('msg').textContent = msg.key ? T(msg.key) : msg.text;
    };

    // Every label in place, for the current language and mode (no reload).
    const render = () => {
      document.title = T('page');
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T(el.getAttribute('data-i18n')); });
      const register = mode === 'register';
      $('title').textContent = T(register ? 'registerTitle' : 'title');
      $('subtitle').textContent = T(register ? 'registerSubtitle' : 'subtitle');
      $('btn').textContent = T(register ? 'registerBtn' : 'btn');
      $('hint').textContent = register ? T('registerHint') : '';
      $('langs').setAttribute('aria-label', T('language'));
      ['en', 'th'].forEach((l) => $('lang-' + l).setAttribute('aria-pressed', String(l === lang)));
      const label = T(isDark() ? 'toLight' : 'toDark');
      $('theme').setAttribute('aria-label', label);
      $('theme').title = label;
      $('theme').innerHTML = isDark() ? SUN : MOON;
      renderMsg();
    };

    ['en', 'th'].forEach((l) => $('lang-' + l).addEventListener('click', () => {
      lang = l;
      localStorage.setItem('zs.lang', l);
      root.lang = l;
      render();
    }));
    $('theme').addEventListener('click', () => {
      localStorage.setItem('zs.theme', isDark() ? 'light' : 'dark');
      applyTheme();
      render();
    });
    media.addEventListener('change', () => { if (!savedTheme()) { applyTheme(); render(); } });
    render();

    // Decide Login vs Register: register is offered only while no user exists.
    fetch('/api/auth/status')
      .then(r => r.json())
      .then(d => {
        mode = d.registered ? 'login' : 'register';
        if (mode === 'register') {
          $('p').setAttribute('autocomplete', 'new-password');
          render();
        }
      })
      .catch(() => { setMsg('msg err', 'noServer'); });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = $('u').value.trim();
      const password = $('p').value;
      if (!username || !password) return;

      $('btn').disabled = true;
      setMsg('msg', 'checking');
      try {
        const res = await fetch('/api/auth/' + mode, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw Object.assign(new Error(data.detail || ''), { key: data.detail ? '' : 'failed' });

        localStorage.setItem('z_token', data.token);
        // Cookie lets a plain browser navigation (the SPA URL) pass the gate too.
        document.cookie = 'z_token=' + data.token + '; path=/; max-age=86400; samesite=lax' + (location.protocol === 'https:' ? '; secure' : '');
        setMsg('msg ok', 'success');
        location.href = '/';
      } catch (err) {
        setMsg('msg err', err.key, err.message);
        $('btn').disabled = false;
      }
    });
  });
})();
</script>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="seg" id="langs" role="group" aria-label="Language">
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
        <button type="button" id="lang-th" aria-pressed="false">TH</button>
      </div>
      <button type="button" class="icon-btn" id="theme" aria-label="Theme"></button>
    </div>

    <form class="card" id="form">
      <div class="brand">
        <span class="tile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
        </span>
        <div>
          <div class="brand-name">Z-Service</div>
          <div class="brand-tag" data-i18n="tagline">Market data service</div>
        </div>
      </div>

      <h1 id="title">Sign in</h1>
      <p class="sub" id="subtitle">Enter your username and password</p>

      <label for="u" data-i18n="username">Username</label>
      <input id="u" autocomplete="username" autofocus required />

      <label for="p" data-i18n="password">Password</label>
      <input id="p" type="password" autocomplete="current-password" required />

      <button class="submit" id="btn" type="submit">Sign in</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div class="hint" id="hint"></div>
    </form>
  </div>
</body>
</html>
